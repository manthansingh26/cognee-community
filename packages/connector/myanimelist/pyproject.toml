[project]
name = "cognee-community-connector-myanimelist"
version = "0.1.0"
description = "MyAnimeList data-source connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.25.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_myanimelist"]
